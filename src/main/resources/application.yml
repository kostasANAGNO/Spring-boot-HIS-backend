# Shared configuration. Secrets have NO defaults here: they must come from the environment
# (or from the dev-only defaults in application-local.yml when the "local" profile is active).
spring:
  application:
    name: his
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway is the ONLY owner of the schema; Hibernate just verifies entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:1h}
    issuer: ${JWT_ISSUER:his-backend}
  appointments:
    min-duration: ${APPOINTMENT_MIN_DURATION:5m}
    max-duration: ${APPOINTMENT_MAX_DURATION:8h}
  medication:
    early-tolerance: ${MEDICATION_EARLY_TOLERANCE:30m}
  billing:
    bed-day-code: ${BILLING_BED_DAY_CODE:BED-DAY}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health          # nothing else is exposed
  endpoint:
    health:
      probes:
        enabled: true            # /actuator/health/liveness and /actuator/health/readiness
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
