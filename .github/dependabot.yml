# Keeps dependencies current. Each pull request runs the full CI (tests, architecture rules, image smoke test).
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      spring:
        patterns: ["org.springframework*"]
      testing:
        patterns: ["org.testcontainers*", "org.mockito*", "org.junit*", "com.tngtech.archunit*", "org.jacoco*"]
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(docker)"
